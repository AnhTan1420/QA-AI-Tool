
name: Supabase Keep Alive

on:
  schedule:
    # Every day at 03:00 UTC (10:00 AM Vietnam time)
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify keep-alive script exists
        run: |
          if [ ! -f scripts/keep-supabase-alive.mjs ]; then
            echo "::error::Missing scripts/keep-supabase-alive.mjs"
            echo "Available scripts:"
            ls -la scripts/ || true
            exit 1
          fi

      - name: Install Supabase SDK
        run: npm install @supabase/supabase-js --no-save

      - name: Ping Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/keep-supabase-alive.mjs
